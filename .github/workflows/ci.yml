# The checks live in tools/check.sh so they can be run without GitHub.
#
# This workflow used to *be* the checks, which made a service the only place the
# repository could be verified. Now it calls the script, and so can you:
#
#     tools/check.sh
#
# The app targets are deliberately absent. Building them needs Xcode 26 and the
# iOS 26 SDK, and pinning a workflow to an image that may not have them yet buys
# a red badge that says nothing about the code. The README states the two
# xcodebuild commands for a local check instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tools/check.sh
    # macOS because SolvrCore needs a Swift toolchain; everything else in the
    # script is stdlib Python.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Run the same script a contributor runs
        run: tools/check.sh

  security-regressions:
    name: Grader and renderer security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned grader dependencies
        run: python -m pip install -r tools/eval/requirements.txt
      - name: Reject executable answer strings
        run: python -m unittest discover -s tools/eval -p 'test_*.py' -v
      - name: Verify vendored renderer and prototype-pollution regression
        run: node --test tools/eval/test_katex.cjs
