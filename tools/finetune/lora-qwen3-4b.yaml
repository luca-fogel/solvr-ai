# mlx_lm.lora configuration for the Solvr output-shape fine-tune.
#
# Committed rather than passed as flags so a run is reproducible and a change to
# it shows up in a diff.

model: "mlx-community/Qwen3-4B-4bit"
train: true
data: "tools/finetune/data"

fine_tune_type: lora
optimizer: adamw

# The last 16 blocks of 36. Formatting and structure live near the output; going
# deeper costs memory and time for a target that does not need it.
num_layers: 16

# One sequence per forward pass, four accumulated before each optimiser step.
#
# Metal kept killing the run with
# kIOGPUCommandBufferCallbackErrorImpactingInteractivity -- macOS ending a command
# buffer that blocked the display too long. At batch 4 it died on the first
# validation; at batch 2 validation was fine (19s, down from 223s) and it died on
# a training step instead, in mx.eval over the gradients. The work per buffer was
# the problem, not the total work.
#
# Accumulation keeps the effective batch at four, so the optimisation dynamics are
# unchanged, while each buffer holds a quarter as much. 600 steps x 4 examples over
# 875 training examples is a little under three epochs, which is the right amount
# for teaching an output format rather than new knowledge.
batch_size: 1
grad_accumulation_steps: 4
iters: 600
learning_rate: 1e-5
# 1792 rather than 2048: the p99 example is 1624 tokens and the longest is 1748,
# so this truncates nothing and trims the worst-case buffer.
max_seq_length: 1792

# The loss belongs on the answer, not on the problem statement. The whole point is
# teaching an output shape, and training on the prompt teaches the model to write
# maths problems instead.
mask_prompt: true

steps_per_report: 25
steps_per_eval: 100
# Five, not twenty-five. One validation pass over a hundred examples took 223
# seconds and was the command buffer macOS objected to. Twenty examples is enough
# to see the curve move, and it is the curve that matters, not its precision.
val_batches: 5
save_every: 100
adapter_path: "tools/finetune/adapters"

# Off. It trades compute for memory, and memory was never the constraint -- the
# smoke run peaked at 3.56 GB of 64 -- while the extra recomputation lengthens
# exactly the buffer macOS was objecting to.
grad_checkpoint: false
seed: 20260822
