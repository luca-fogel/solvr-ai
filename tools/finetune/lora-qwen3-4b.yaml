# mlx_lm.lora configuration for the Solvr output-shape fine-tune.
#
# Committed rather than passed as flags so a run is reproducible and a change to
# it shows up in a diff.

model: "mlx-community/Qwen3-4B-4bit"
train: true
data: "tools/finetune/data"

fine_tune_type: lora
optimizer: adamw

# The last 16 blocks of 36. Formatting and structure live near the output; going
# deeper costs memory and time for a target that does not need it.
num_layers: 16

batch_size: 4
iters: 600
learning_rate: 1e-5
max_seq_length: 2048

# The loss belongs on the answer, not on the problem statement. The whole point is
# teaching an output shape, and training on the prompt teaches the model to write
# maths problems instead.
mask_prompt: true

steps_per_report: 25
steps_per_eval: 100
val_batches: 25
save_every: 100
adapter_path: "tools/finetune/adapters"

grad_checkpoint: true
seed: 20260822
